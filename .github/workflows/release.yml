name: Release

# Al publicar un tag vX.Y.Z se construye el ZIP instalable (carpeta raíz
# «secop-suite-main/», la de producción) y se adjunta a un GitHub Release. El actualizador del plugin
# (includes/class-updater.php) descarga el asset «secop-suite.zip».
#
#   git tag v5.18.0 && git push origin v5.18.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verificar que el tag coincide con la versión del plugin
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(grep -m1 -E '^[[:space:]/*#]*Version:' secop-suite.php | sed -E 's/.*Version:[[:space:]]*//; s/[[:space:]]*$//' | tr -d '\r')"
          CONST_VERSION="$(sed -nE "s/.*define\([[:space:]]*'SECOP_SUITE_VERSION'[[:space:]]*,[[:space:]]*'([^']+)'.*/\1/p" secop-suite.php | head -n1)"
          echo "Tag: ${TAG_VERSION} | Version: ${HEADER_VERSION} | SECOP_SUITE_VERSION: ${CONST_VERSION}"
          if [ "${TAG_VERSION}" != "${HEADER_VERSION}" ] || [ "${TAG_VERSION}" != "${CONST_VERSION}" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con Version: (${HEADER_VERSION}) y/o SECOP_SUITE_VERSION (${CONST_VERSION}) de secop-suite.php"
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sintaxis PHP y pruebas
        run: |
          set -euo pipefail
          php --version
          find . -name '*.php' -not -path './.git/*' -not -path './.claude/*' -print0 | xargs -0 -n1 php -l > /dev/null
          php tests/run.php

      - name: Construir ZIP
        run: bash bin/build-zip.sh

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          FILES=("dist/secop-suite.zip" "dist/secop-suite-${VERSION}.zip")
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SECOP Suite ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi
